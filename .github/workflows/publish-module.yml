name: Publish Apple Music startup fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-module.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare verified neutral module
        run: |
          curl --fail --location --retry 3 'https://github.com/Lumia1193/apple-music-releases/releases/download/module-build-2026101402/apple-music-1.0.module.zip' --output apple-music-base.zip
          python3 - <<'PY'
          import base64, gzip, hashlib, json, zipfile
          source='apple-music-base.zip'
          assert hashlib.sha256(open(source,'rb').read()).hexdigest()=='29c40acc4b862ef8e4909b714badbd2e53824fc33bb2e202e1308d960abba08c'
          updates=json.loads(gzip.decompress(base64.b64decode('')))
          with zipfile.ZipFile(source) as old, zipfile.ZipFile('apple-music-1.0.module.zip','w',compression=zipfile.ZIP_DEFLATED) as new:
              names=set()
              for entry in old.infolist():
                  name=entry.filename
                  assert not name.lower().endswith(('.icue','.icuewidget'))
                  assert not name.startswith('/') and '..' not in name.split('/')
                  names.add(name)
                  data=base64.b64decode(updates[name]) if name in updates else old.read(name)
                  new.writestr(entry,data)
              for name,value in updates.items():
                  if name not in names: new.writestr(name,base64.b64decode(value))
          print('SHA256:',hashlib.sha256(open('apple-music-1.0.module.zip','rb').read()).hexdigest())
          PY
      - name: Publish Apple Music 1.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view module-build-2026101404 --repo "$GH_REPO" >/dev/null 2>&1; then exit 0; fi
          gh release create module-build-2026101404 apple-music-1.0.module.zip --repo "$GH_REPO" --title 'Apple Music 1.0' --notes 'Fix startup queue loading and retries. Remove the window visibility guard that interfered with Apple Music Windows. Orbit activation instructions in nine languages. White library sort text. Radio dependency and license included. No .icue or .icuewidget package is included. Public version remains 1.0.'
